name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint-test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: make setup
      - run: make lint test bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: evidence/
